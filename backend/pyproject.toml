[project]
name = "crm-bds-ai"
version = "0.1.0"
description = "CRM_BDS_AI - Modular Monolith backend shell (Sprint 1 Engineering Foundation). No business code."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # EXACT_LOCK from Technology Toolchain Lock (ENG-TOOLCHAIN-001)
    "fastapi==0.139.2",
    "sqlalchemy==2.0.51",
    # APPROVED_FAMILY resolved exact versions (recorded in implementation-notes.md)
    "alembic>=1.19,<2",
    "celery>=5.6,<6",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "pyyaml>=6,<7",
    "structlog>=26.1,<27",
    "uvicorn>=0.52,<1",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5,<2",
    "jsonschema>=4.26,<5",
    "openapi-spec-validator>=0.9,<1",
    "pyright>=1.1.411,<2",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_bds_ai"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src"]
exclude = ["tests", "**/node_modules"]
# Framework-glue pragmas (FastAPI/Celery/kombu ship without strict type stubs).
# These rules are known to produce false positives for decorator-registered
# handlers and untyped third-party libraries; the remaining strict rules apply.
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnusedFunction = false

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: requires the local PostgreSQL stack (docker compose services)",
]
